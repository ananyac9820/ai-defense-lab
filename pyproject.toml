[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-defense-lab"
version = "0.1.0"
description = "AI Defense Lab for Payment Security - Mastercard Innovation Challenge @ GFF 2026"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "rfc3339-validator>=0.1.4",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "xgboost>=2.1",
    "shap>=0.46",
    "networkx>=3.3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "phase2: asserts a Phase 2 deliverable; expected to xfail until the simulator exists",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
